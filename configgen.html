<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mcptransformer 配置生成器</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eff4ff;
    --danger: #dc2626;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .lang-switch {
    display: flex;
    gap: 4px;
    background: var(--bg);
    border-radius: 6px;
    padding: 2px;
  }
  .lang-btn {
    padding: 4px 8px;
    font-size: 12px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background: transparent;
    color: var(--muted);
  }
  .lang-btn.active {
    background: var(--accent);
    color: white;
  }
  .wrap {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 16px;
    padding: 16px 24px;
    align-items: start;
  }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h2 { margin: 0 0 12px; font-size: 14px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], select, textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    font-size: 13px;
    background: #fff;
    color: var(--text);
  }
  textarea { resize: vertical; min-height: 52px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .invalid { border-color: var(--danger) !important; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; min-width: 0; }
  .server-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .server-head .title { font-weight: 600; }
  .toolbar { display: flex; gap: 6px; }
  button {
    cursor: pointer;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    padding: 6px 12px;
    font: inherit;
    font-size: 13px;
    color: var(--text);
  }
  button:hover { background: var(--accent-soft); border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(0.95); }
  button.small { padding: 3px 8px; font-size: 12px; }
  button.icon { padding: 3px 7px; line-height: 1; }
  button.danger { color: var(--danger); border-color: #fca5a5; }
  button.danger:hover { background: #fef2f2; border-color: var(--danger); }
  .output textarea {
    min-height: 480px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    background: #0f172a;
    color: #e2e8f0;
    border: none;
  }
  #cmds {
    margin: 0;
    padding: 12px 14px;
    background: #0f172a;
    color: #e2e8f0;
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-all;
    overflow-x: auto;
  }
  #cmds .c { color: #7dd3fc; }
  #cmds .cm { color: #94a3b8; }
  .output-actions { display: flex; gap: 8px; margin-top: 10px; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  #addServer { width: 100%; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <div>
    <h1 data-i18n="title">mcptransformer 配置生成器</h1>
    <p data-i18n="desc">生成用于把 stdio MCP 服务器桥接为 Streamable HTTP 服务的 config.yaml（纯本地运行，无任何上传）</p>
  </div>
  <div class="lang-switch">
    <button class="lang-btn active" onclick="switchLang('zh')">中文</button>
    <button class="lang-btn" onclick="switchLang('en')">EN</button>
  </div>
</header>

<div class="wrap">
  <div>
    <div class="card">
      <h2 data-i18n="globalSettings">全局设置</h2>
      <label for="listen" data-i18n="listenPort">MCP 业务端口 listen</label>
      <input type="text" id="listen" value=":8080" oninput="update()">
    </div>

    <div class="card">
      <h2 data-i18n="adminSettings">Admin 管理设置（可选）</h2>
      <label for="adminListen" data-i18n="adminPort">管理端口 admin.listen</label>
      <input type="text" id="adminListen" value=":8081" oninput="update()" placeholder=":8081">
      <div class="hint" data-i18n="adminPortHint">与 listen 相同则两个端口合并挂载。留空则仅保留 listen。</div>
      <div class="row">
        <div>
          <label for="adminStatusPath" data-i18n="statusPath">状态查询路径 statusPath</label>
          <input type="text" id="adminStatusPath" value="/__admin/status" oninput="update()" placeholder="/__admin/status">
        </div>
        <div>
          <label for="adminControlPath" data-i18n="controlPath">控制路径 controlPath</label>
          <input type="text" id="adminControlPath" value="/__admin/control" oninput="update()" placeholder="/__admin/control">
        </div>
      </div>
    </div>

    <div id="servers"></div>

    <button id="addServer" class="primary" onclick="addServer()" data-i18n="addServer">+ 添加服务器</button>
  </div>

  <div class="card output">
    <h2 data-i18n="generatedConfig">生成的 config.yaml</h2>
    <textarea id="out" readonly spellcheck="false"></textarea>
    <div class="output-actions">
      <button class="primary" onclick="copyOut()" data-i18n="copy">复制</button>
      <button onclick="downloadOut()" data-i18n="download">下载 config.yaml</button>
    </div>
    <h2 style="margin-top:16px;" data-i18n="controlCommands">服务控制和状态查询命令</h2>
    <pre id="cmds" spellcheck="false"></pre>
  </div>
</div>

<script>
"use strict";

// 国际化翻译对象
const i18n = {
  zh: {
    title: "mcptransformer 配置生成器",
    desc: "生成用于把 stdio MCP 服务器桥接为 Streamable HTTP 服务的 config.yaml（纯本地运行，无任何上传）",
    globalSettings: "全局设置",
    listenPort: "MCP 业务端口 listen",
    adminSettings: "Admin 管理设置（可选）",
    adminPort: "管理端口 admin.listen",
    adminPortHint: "与 listen 相同则两个端口合并挂载。留空则仅保留 listen。",
    statusPath: "状态查询路径 statusPath",
    controlPath: "控制路径 controlPath",
    addServer: "+ 添加服务器",
    generatedConfig: "生成的 config.yaml",
    copy: "复制",
    download: "下载 config.yaml",
    controlCommands: "服务控制和状态查询命令",
    server: "服务器",
    moveUp: "上移",
    moveDown: "下移",
    duplicate: "复制",
    delete: "删除",
    nameLabel: "name *",
    endpointLabel: "endpoint *",
    versionLabel: "version（server 实现版本，默认 1.0.0）",
    protocolVersionLabel: "protocolVersion（对外固定协议版本）",
    defaultProtocol: "默认（跟随客户端协商）",
    commandLabel: "command *",
    argsLabel: "args（每行一个参数）",
    envLabel: "env（每行一个 KEY=VALUE）",
    noServers: "还没有服务器，点击下方\"添加服务器\"。",
    copied: "已复制到剪贴板",
    noServersYaml: "（暂无服务器）",
    // curl 命令示例
    cmdStatus: "# 查看所有 server 状态（GET）",
    cmdControl: "# 控制操作（POST），action 可选 reload / stop / start",
    cmdAllServers: "# 作用于全部 server：不传 server 字段",
    cmdSingleServer: "# 作用于单个 server（server 用配置里的 name，例如 \""
  },
  en: {
    title: "mcptransformer Config Generator",
    desc: "Generate config.yaml for bridging stdio MCP servers to Streamable HTTP services (runs locally, no uploads)",
    globalSettings: "Global Settings",
    listenPort: "MCP business port listen",
    adminSettings: "Admin Settings (Optional)",
    adminPort: "Admin port admin.listen",
    adminPortHint: "Same as listen to merge ports. Leave empty to keep only listen.",
    statusPath: "Status query path statusPath",
    controlPath: "Control path controlPath",
    addServer: "+ Add Server",
    generatedConfig: "Generated config.yaml",
    copy: "Copy",
    download: "Download config.yaml",
    controlCommands: "Service Control and Status Query Commands",
    server: "Server",
    moveUp: "Move Up",
    moveDown: "Move Down",
    duplicate: "Duplicate",
    delete: "Delete",
    nameLabel: "name *",
    endpointLabel: "endpoint *",
    versionLabel: "version (server implementation version, default 1.0.0)",
    protocolVersionLabel: "protocolVersion (fixed protocol version)",
    defaultProtocol: "Default (negotiate with client)",
    commandLabel: "command *",
    argsLabel: "args (one argument per line)",
    envLabel: "env (one KEY=VALUE per line)",
    noServers: "No servers yet. Click \"Add Server\" below.",
    copied: "Copied to clipboard",
    noServersYaml: "(no servers)",
    // curl command examples
    cmdStatus: "# Check all server status (GET)",
    cmdControl: "# Control action (POST), action can be reload / stop / start",
    cmdAllServers: "# Apply to all servers: omit server field",
    cmdSingleServer: "# Apply to single server (use config name, e.g. \""
  }
};

let currentLang = 'zh';

function switchLang(lang) {
  currentLang = lang;
  // 更新按钮状态
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent === (lang === 'zh' ? '中文' : 'EN'));
  });
  // 更新所有带data-i18n属性的元素
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[lang][key]) {
      el.textContent = i18n[lang][key];
    }
  });
  // 更新页面标题
  document.title = i18n[lang].title;
  // 重新渲染服务器卡片和命令
  renderServers();
  renderCmds();
}

const VALID_PROTOCOL_VERSIONS = ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"];
const defaultListen = ":8080";
const defaultAdminListen = ":8081";
const defaultStatusPath = "/__admin/status";
const defaultControlPath = "/__admin/control";

let servers = [
  {
    name: "listfiles",
    endpoint: "/mcp/listfiles",
    version: "",
    protocolVersion: "2025-06-18",
    command: "./listfiles",
    args: ["."],
    env: {},
  },
];

// ---- YAML string helpers ----
function quoteYaml(s) {
  return '"' + s.replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\n/g, "\\n") + '"';
}
function yamlStr(v) {
  if (v === null || v === undefined) return '""';
  const s = String(v);
  if (s === "") return '""';
  if (/^\s|\s$/.test(s) || s.includes("\n")) return quoteYaml(s);
  if (/^(true|false|null|yes|no|on|off|~)$/i.test(s)) return quoteYaml(s);
  if (/^[-?:,{}[\]#&*!|>'"%@`]/.test(s)) return quoteYaml(s);
  if (/[:#{}[\],&*!|>'"%@`]/.test(s)) return quoteYaml(s);
  return s;
}

function parseArgs(text) {
  const lines = text.split("\n").map(l => l.trim()).filter(l => l !== "");
  if (lines.length === 0) return [];
  const out = [];
  for (const l of lines) {
    for (const part of l.split(",")) {
      const p = part.trim();
      if (p !== "") out.push(p);
    }
  }
  return out;
}

function parseEnv(text) {
  const env = {};
  for (const line of text.split("\n")) {
    const l = line.trim();
    if (l === "" || l.startsWith("#")) continue;
    const i = l.indexOf("=");
    if (i <= 0) continue;
    env[l.slice(0, i).trim()] = l.slice(i + 1).trim();
  }
  return env;
}

// ---- rendering ----
function serverCard(i, s) {
  const t = i18n[currentLang];
  const argsText = (s.args || []).join("\n");
  const envLines = Object.entries(s.env || {}).map(([k, v]) => k + "=" + v);
  const protoOpts = [["", t.defaultProtocol]]
    .concat(VALID_PROTOCOL_VERSIONS.map(v => [v, v]))
    .map(([val, label]) => {
      const sel = val === (s.protocolVersion || "") ? " selected" : "";
      return '<option value="' + val + '"' + sel + ">" + label + "</option>";
    })
    .join("");

  return '<div class="card" data-idx="' + i + '">' +
    '<div class="server-head">' +
      '<span class="title">' + t.server + ' ' + (i + 1) + '</span>' +
      '<div class="toolbar">' +
        '<button class="icon small" title="' + t.moveUp + '" onclick="moveServer(' + i + ',-1)">&#9650; ' + t.moveUp + '</button>' +
        '<button class="icon small" title="' + t.moveDown + '" onclick="moveServer(' + i + ',1)">&#9660; ' + t.moveDown + '</button>' +
        '<button class="icon small" title="' + t.duplicate + '" onclick="dupServer(' + i + ')">&#10697; ' + t.duplicate + '</button>' +
        '<button class="small danger" title="' + t.delete + '" onclick="removeServer(' + i + ')">&#10005; ' + t.delete + '</button>' +
      '</div>' +
    '</div>' +
    '<div class="row">' +
      '<div>' +
        '<label>' + t.nameLabel + '</label>' +
        '<input type="text" data-f="name" value="' + esc(s.name) + '" oninput="onField(' + i + ')" placeholder="' + (currentLang === 'zh' ? '如 listfiles' : 'e.g. listfiles') + '">' +
      '</div>' +
      '<div>' +
        '<label>' + t.endpointLabel + '</label>' +
        '<input type="text" data-f="endpoint" value="' + esc(s.endpoint) + '" oninput="onField(' + i + ')" placeholder="' + (currentLang === 'zh' ? '如 /mcp/listfiles' : 'e.g. /mcp/listfiles') + '">' +
      '</div>' +
    '</div>' +
    '<div class="row">' +
      '<div>' +
        '<label>' + t.versionLabel + '</label>' +
        '<input type="text" data-f="version" value="' + esc(s.version) + '" oninput="onField(' + i + ')" placeholder="1.0.0">' +
      '</div>' +
      '<div>' +
        '<label>' + t.protocolVersionLabel + '</label>' +
        '<select data-f="protocolVersion" onchange="onField(' + i + ')">' + protoOpts + "</select>" +
      '</div>' +
    '</div>' +
    '<label>' + t.commandLabel + '</label>' +
    '<input type="text" data-f="command" value="' + esc(s.command) + '" oninput="onField(' + i + ')" placeholder="' + (currentLang === 'zh' ? '如 npx' : 'e.g. npx') + '">' +
    '<label>' + t.argsLabel + '</label>' +
    '<textarea data-f="args" oninput="onField(' + i + ')" placeholder="-y&#10;@modelcontextprotocol/server-filesystem">' + esc(argsText) + "</textarea>" +
    '<label>' + t.envLabel + '</label>' +
    '<textarea data-f="env" oninput="onField(' + i + ')" placeholder="LOG_LEVEL=debug">' + esc(envLines.join("\n")) + "</textarea>" +
  "</div>";
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderServers() {
  const el = document.getElementById("servers");
  const t = i18n[currentLang];
  if (servers.length === 0) {
    el.innerHTML = '<div class="card empty">' + t.noServers + '</div>';
  } else {
    el.innerHTML = servers.map((s, i) => serverCard(i, s)).join("");
  }
  update();
}

function onField(i) {
  const card = document.querySelector('#servers [data-idx="' + i + '"]');
  const s = servers[i];
  s.name = card.querySelector('[data-f="name"]').value.trim();
  s.endpoint = card.querySelector('[data-f="endpoint"]').value.trim();
  s.version = card.querySelector('[data-f="version"]').value.trim();
  s.protocolVersion = card.querySelector('[data-f="protocolVersion"]').value;
  s.command = card.querySelector('[data-f="command"]').value.trim();
  s.args = parseArgs(card.querySelector('[data-f="args"]').value);
  s.env = parseEnv(card.querySelector('[data-f="env"]').value);
  update();
}

function addServer() {
  servers.push({ name: "", endpoint: "", version: "", protocolVersion: "", command: "", args: [], env: {} });
  renderServers();
}
function removeServer(i) {
  servers.splice(i, 1);
  renderServers();
}
function dupServer(i) {
  const c = JSON.parse(JSON.stringify(servers[i]));
  c.endpoint = "";
  servers.splice(i + 1, 0, c);
  renderServers();
}
function moveServer(i, d) {
  const j = i + d;
  if (j < 0 || j >= servers.length) return;
  [servers[i], servers[j]] = [servers[j], servers[i]];
  renderServers();
}

// ---- YAML generation ----
function generate() {
  const listen = document.getElementById("listen").value.trim() || ":8080";
  const lines = [];
  lines.push("listen: " + yamlStr(listen));
  lines.push("");
  const adminListen = document.getElementById("adminListen").value.trim();
  const adminStatusPath = document.getElementById("adminStatusPath").value.trim();
  const adminControlPath = document.getElementById("adminControlPath").value.trim();
  if (adminListen || adminStatusPath || adminControlPath) {
    lines.push("admin:");
    if (adminListen) lines.push("  listen: " + yamlStr(adminListen));
    if (adminStatusPath) lines.push("  statusPath: " + yamlStr(adminStatusPath));
    if (adminControlPath) lines.push("  controlPath: " + yamlStr(adminControlPath));
    lines.push("");
  }
  lines.push("servers:");
  if (servers.length === 0) {
    lines.push("  # " + i18n[currentLang].noServersYaml);
  }
  servers.forEach(s => {
    lines.push("  - name: " + yamlStr(s.name || ""));
    lines.push("    endpoint: " + yamlStr(s.endpoint || ""));
    if (s.version) lines.push("    version: " + yamlStr(s.version));
    if (s.protocolVersion) lines.push("    protocolVersion: " + yamlStr(s.protocolVersion));
    lines.push("    command: " + yamlStr(s.command || ""));
    if (s.args && s.args.length) {
      lines.push("    args: [" + s.args.map(a => quoteYaml(a)).join(", ") + "]");
    }
    const envKeys = Object.keys(s.env || {});
    if (envKeys.length) {
      lines.push("    env:");
      for (const k of envKeys) lines.push("      " + yamlStr(k) + ": " + yamlStr(s.env[k]));
    }
  });
  return lines.join("\n") + "\n";
}

function update() {
  document.getElementById("out").value = generate();
  renderCmds();
  validate();
}

// ---- curl command examples (based on current admin/listen config) ----
function parseAddr(s) {
  s = (s || "").trim();
  if (s === "") return null;
  let host = "", port = "";
  if (s.startsWith("[")) {
    const i = s.indexOf("]");
    if (i < 0) return null;
    host = s.slice(0, i + 1);
    const rest = s.slice(i + 1);
    port = rest.startsWith(":") ? rest.slice(1) : "";
  } else {
    const i = s.lastIndexOf(":");
    if (i < 0) {
      host = s;
    } else {
      host = s.slice(0, i);
      port = s.slice(i + 1);
    }
  }
  return { host, port };
}
function baseURL(addr) {
  const p = parseAddr(addr);
  if (!p) return null;
  let host = p.host;
  if (host === "" || host === "0.0.0.0" || host === "[::]") host = "127.0.0.1";
  const port = p.port || "";
  return "http://" + host + (port ? ":" + port : "");
}
function escJSON(s) {
  return String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
}
function renderCmds() {
  const listen = document.getElementById("listen").value.trim() || defaultListen;
  const adminListen = document.getElementById("adminListen").value.trim() || defaultAdminListen;
  const statusPath = document.getElementById("adminStatusPath").value.trim() || defaultStatusPath;
  const controlPath = document.getElementById("adminControlPath").value.trim() || defaultControlPath;
  const effAdmin = adminListen === listen ? listen : adminListen;
  const base = baseURL(effAdmin);
  const example = servers.find(s => s.name) || { name: "listfiles" };
  const n = escJSON(example.name);
  const t = i18n[currentLang];
  const cmd = [];
  cmd.push(t.cmdStatus);
  cmd.push("curl -s " + base + statusPath);
  cmd.push("");
  cmd.push(t.cmdControl);
  cmd.push(t.cmdAllServers);
  cmd.push("curl -s -X POST " + base + controlPath + " \\");
  cmd.push("  -H 'Content-Type: application/json' -d '{\"action\":\"reload\"}'");
  cmd.push("");
  cmd.push(t.cmdSingleServer + example.name + "\")");
  cmd.push("curl -s -X POST " + base + controlPath + " \\");
  cmd.push("  -H 'Content-Type: application/json' -d '{\"action\":\"reload\",\"server\":\"" + n + "\"}'");
  document.getElementById("cmds").textContent = cmd.join("\n");
}

function validate() {
  servers.forEach((s, i) => {
    const card = document.querySelector('#servers [data-idx="' + i + '"]');
    if (!card) return;
    const nameEl = card.querySelector('[data-f="name"]');
    const epEl = card.querySelector('[data-f="endpoint"]');
    const cmdEl = card.querySelector('[data-f="command"]');
    nameEl.classList.toggle("invalid", !nameEl.value.trim());
    epEl.classList.toggle("invalid", !epEl.value.trim() || !epEl.value.trim().startsWith("/"));
    cmdEl.classList.toggle("invalid", !cmdEl.value.trim());
  });
}

// ---- output actions ----
function copyOut() {
  const el = document.getElementById("out");
  el.select();
  el.setSelectionRange(0, el.value.length);
  const t = i18n[currentLang];
  navigator.clipboard.writeText(el.value).then(() => flash(t.copied));
}
function downloadOut() {
  const blob = new Blob([document.getElementById("out").value], { type: "application/yaml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "config.yaml";
  a.click();
  URL.revokeObjectURL(a.href);
}
function flash(msg) {
  const b = document.getElementById("addServer");
  const old = b.textContent;
  b.textContent = msg;
  setTimeout(() => (b.textContent = old), 1500);
}

renderServers();
</script>
</body>
